<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
<title id="title">Job comparison simulator illustration</title>
<desc id="desc">Editorial data illustration for the WhereWise interface.</desc>
<defs>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#18343A" flood-opacity=".12"/>
  </filter>
  <linearGradient id="tealGrad" x1="0" x2="1" y1="0" y2="1">
    <stop stop-color="#47AAA2"/>
    <stop offset="1" stop-color="#207A77"/>
  </linearGradient>
  <linearGradient id="skyGrad" x1="0" x2="0" y1="0" y2="1">
    <stop stop-color="#F1FBFA"/>
    <stop offset="1" stop-color="#E5F4F2"/>
  </linearGradient>
</defs>

<rect x="24" y="24" width="592" height="352" rx="32" fill="url(#skyGrad)"/>
<path d="M92 288 C132 250 168 262 208 240 C248 218 276 240 314 214 C356 186 392 206 432 178 C470 152 508 166 551 132"
      fill="none" stroke="#2B8F8A" stroke-width="12" stroke-linecap="round" opacity=".18"/>

<g filter="url(#shadow)">
  <rect x="66" y="70" width="468" height="246" rx="24" fill="#FFFFFF"/>
</g>

<!-- Two situations compared: the same salary split into rent, other bills and what is left -->
<line x1="104" y1="282" x2="336" y2="282" stroke="#D9E5E7" stroke-width="3" stroke-linecap="round"/>

<g>
  <rect x="122" y="130" width="70" height="62" rx="6" fill="#4C78D8"/>
  <rect x="122" y="192" width="70" height="40" rx="6" fill="#DB9B34"/>
  <rect x="122" y="232" width="70" height="48" rx="6" fill="url(#tealGrad)"/>
</g>

<g>
  <rect x="248" y="86" width="70" height="92" rx="6" fill="#4C78D8"/>
  <rect x="248" y="178" width="70" height="46" rx="6" fill="#DB9B34"/>
  <rect x="248" y="224" width="70" height="56" rx="6" fill="url(#tealGrad)"/>
</g>

<!-- The line that matters: how much is left over, before and after -->
<path d="M104 232 H336" fill="none" stroke="#207A77" stroke-width="3" stroke-linecap="round"
      stroke-dasharray="8 10" opacity=".55"/>
<circle cx="336" cy="232" r="6" fill="#207A77" opacity=".55"/>
<path d="M312 206 L336 224 L312 224 Z" fill="#207A77" opacity=".35"/>

<!-- Summary panel -->
<g transform="translate(384 104)">
  <rect width="118" height="176" rx="18" fill="#F5FAFA" stroke="#D9E5E7"/>
  <circle cx="59" cy="48" r="29" fill="#DDF3F0"/>
  <circle cx="59" cy="48" r="17" fill="url(#tealGrad)"/>
  <circle cx="59" cy="48" r="8" fill="#FFFFFF" opacity=".35"/>
  <rect x="24" y="94" width="70" height="10" rx="5" fill="#D9E5E7"/>
  <rect x="24" y="94" width="61" height="10" rx="5" fill="#2B8F8A"/>
  <rect x="24" y="120" width="70" height="10" rx="5" fill="#D9E5E7"/>
  <rect x="24" y="120" width="38" height="10" rx="5" fill="#4C78D8"/>
  <rect x="24" y="146" width="70" height="10" rx="5" fill="#D9E5E7"/>
  <rect x="24" y="146" width="52" height="10" rx="5" fill="#DB9B34"/>
</g>

</svg>
